<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Syrma SGS · Training Assessment Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =========================================================
   DESIGN TOKENS
========================================================= */
:root{
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;

  --accent:#21C97B;        /* PCB copper-pad green — pulled from the source test-paper answer key */
  --accent-rgb:33,201,123;
  --accent-2:#4C8DFF;      /* circuit-trace blue */
  --accent-2-rgb:76,141,255;
  --danger:#FF5C72;
  --danger-rgb:255,92,114;
  --warning:#FFB74A;

  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --ease:cubic-bezier(.22,.9,.32,1);
}

html[data-theme="dark"]{
  --bg-0:#070B12;
  --bg-1:#0C1220;
  --bg-2:#111a2b;
  --panel:rgba(255,255,255,0.045);
  --panel-solid:#111a2b;
  --border:rgba(255,255,255,0.09);
  --border-strong:rgba(255,255,255,0.16);
  --text:#EAF0FA;
  --muted:#8C97AE;
  --muted-2:#5c6784;
  --shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  --input-bg:rgba(255,255,255,0.045);
  --scrim: radial-gradient(1200px 700px at 12% -10%, rgba(76,141,255,0.16), transparent 60%),
           radial-gradient(1000px 620px at 110% 10%, rgba(33,201,123,0.13), transparent 55%);
}
html[data-theme="light"]{
  --bg-0:#F2F5FA;
  --bg-1:#E9EDF5;
  --bg-2:#dfe5f0;
  --panel:rgba(255,255,255,0.62);
  --panel-solid:#ffffff;
  --border:rgba(16,23,42,0.09);
  --border-strong:rgba(16,23,42,0.16);
  --text:#0E1420;
  --muted:#5A6479;
  --muted-2:#828da3;
  --shadow:0 20px 50px -22px rgba(30,40,70,0.22);
  --input-bg:rgba(16,23,42,0.035);
  --scrim: radial-gradient(1200px 700px at 12% -10%, rgba(76,141,255,0.10), transparent 60%),
           radial-gradient(1000px 620px at 110% 10%, rgba(33,201,123,0.10), transparent 55%);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:
    var(--scrim),
    var(--bg-0);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .4s var(--ease), color .4s var(--ease);
}
::selection{background:rgba(var(--accent-rgb),0.32);}

h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body);}
.mono{font-family:var(--font-mono);}

a{color:inherit;}

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* =========================================================
   LAYOUT SHELL
========================================================= */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(16px,4vw,40px);
  background:linear-gradient(to bottom, var(--bg-0) 60%, transparent);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;position:relative;overflow:hidden;
  background:linear-gradient(145deg, rgba(var(--accent-rgb),0.22), rgba(var(--accent-2-rgb),0.22));
  border:1px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:22px;height:22px;}
.brand-text{display:flex;flex-direction:column;line-height:1.05;}
.brand-text b{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.02em;}
.brand-text span{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}

.top-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--text);transition:transform .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--border-strong);}
.icon-btn svg{width:18px;height:18px;}

.pill-link{
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
  border:1px solid var(--border);background:var(--panel);backdrop-filter:blur(10px);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .25s var(--ease);
}
.pill-link:hover{border-color:rgba(var(--accent-2-rgb),.5);transform:translateY(-2px);}

main{flex:1;position:relative;}
.view{
  max-width:1180px;margin:0 auto;padding:10px clamp(16px,4vw,40px) 80px;
  animation:viewIn .5s var(--ease);
}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}

/* =========================================================
   GLASS PANEL / CARD
========================================================= */
.glass{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:var(--shadow);
  position:relative;
}
.pad{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(var(--accent-rgb),.55);box-shadow:0 0 10px rgba(var(--accent-rgb),.6);}
.pad.tl{top:14px;left:14px;} .pad.tr{top:14px;right:14px;} .pad.bl{bottom:14px;left:14px;} .pad.br{bottom:14px;right:14px;}

/* =========================================================
   BUTTONS
========================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:13px;font-weight:700;font-size:14.5px;
  border:1px solid transparent;cursor:pointer;transition:transform .2s var(--ease), box-shadow .3s var(--ease), opacity .2s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(135deg, var(--accent), #17a866);
  color:#04150C;box-shadow:0 12px 30px -10px rgba(var(--accent-rgb),.55);
}
.btn-primary:hover{box-shadow:0 16px 36px -8px rgba(var(--accent-rgb),.7);transform:translateY(-2px);}
.btn-ghost{
  background:var(--panel);border-color:var(--border);color:var(--text);
}
.btn-ghost:hover{border-color:var(--border-strong);transform:translateY(-2px);}
.btn-outline-accent{background:transparent;border-color:rgba(var(--accent-2-rgb),.5);color:var(--accent-2);}
.btn-outline-accent:hover{background:rgba(var(--accent-2-rgb),.1);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.pill-link svg{width:15px;height:15px;flex-shrink:0;}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px;}
.btn-block{width:100%;}
.btn-danger{background:rgba(var(--danger-rgb),.12);border-color:rgba(var(--danger-rgb),.4);color:var(--danger);}

/* =========================================================
   FORMS
========================================================= */
label.field-label{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px;}
.field{margin-bottom:18px;}
input[type=text],input[type=date],select{
  width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);font-size:14.5px;font-family:var(--font-body);
  outline:none;transition:border-color .2s, box-shadow .2s;
}
input[type=text]:focus,input[type=date]:focus,select:focus{
  border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(var(--accent-2-rgb),.15);
}
input::placeholder{color:var(--muted-2);}

/* =========================================================
   UTILITIES
========================================================= */
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.grid{display:grid;}
.muted{color:var(--muted);}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center;}
.hide-sm{display:inline;}
@media(max-width:640px){.hide-sm{display:none;}}

/* =========================================================
   HERO
========================================================= */
.hero{position:relative;padding:56px 8px 34px;overflow:hidden;border-radius:28px;margin-bottom:8px;}
.hero-trace{position:absolute;inset:0;z-index:0;opacity:.55;pointer-events:none;}
.hero-trace path{stroke:url(#traceGrad);stroke-width:1.4;fill:none;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 2.6s var(--ease) forwards;}
.hero-trace circle{fill:var(--accent);opacity:0;animation:padIn .5s ease forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes padIn{to{opacity:.8;}}
.hero-inner{position:relative;z-index:1;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--panel);font-size:12px;font-weight:600;
  letter-spacing:.04em;color:var(--accent);margin-bottom:22px;
}
.eyebrow svg{width:14px;height:14px;}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.08;font-weight:800;max-width:16ch;}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p.lead{margin-top:16px;color:var(--muted);font-size:16px;max-width:52ch;line-height:1.6;}

/* test cards */
.test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;}
@media(max-width:900px){.test-grid{grid-template-columns:1fr;}}
.test-card{padding:26px 24px 24px;cursor:pointer;transition:transform .3s var(--ease),border-color .3s;}
.test-card:hover{transform:translateY(-6px);border-color:rgba(var(--accent-2-rgb),.45);}
.test-badge{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg, rgba(var(--accent-rgb),.22), rgba(var(--accent-2-rgb),.18));
  border:1px solid var(--border-strong);color:var(--accent);font-family:var(--font-mono);font-weight:700;font-size:13px;
  margin-bottom:18px;
}
.test-card h3{font-size:19px;margin-bottom:6px;}
.test-card p{color:var(--muted);font-size:13.5px;line-height:1.55;min-height:42px;}
.test-meta{display:flex;gap:18px;margin:18px 0 20px;font-size:12px;color:var(--muted);font-family:var(--font-mono);}
.test-meta b{color:var(--text);}
.test-card .btn{width:100%;}

/* =========================================================
   PRE-TEST FORM
========================================================= */
.form-card{max-width:560px;margin:30px auto 0;padding:36px clamp(20px,4vw,42px);}
.form-head{margin-bottom:28px;}
.form-head .tag{font-family:var(--font-mono);font-size:12px;color:var(--accent);letter-spacing:.08em;}
.form-head h2{font-size:26px;margin-top:6px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.err-text{color:var(--danger);font-size:12px;margin-top:6px;display:none;}
.field.invalid input,.field.invalid select{border-color:var(--danger);}
.field.invalid .err-text{display:block;}

/* =========================================================
   QUIZ
========================================================= */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.quiz-info{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);}
.progress-track{height:7px;border-radius:99px;background:var(--panel);border:1px solid var(--border);overflow:hidden;margin-bottom:22px;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .4s var(--ease);}
.qnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.qdot{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--panel);
  cursor:pointer;color:var(--muted);transition:all .2s var(--ease);
}
.qdot:hover{border-color:var(--border-strong);}
.qdot.answered{color:var(--text);border-color:rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.12);}
.qdot.current{outline:2px solid var(--accent-2);outline-offset:2px;}
.question-card{padding:30px clamp(18px,4vw,40px);}
.question-card h3{font-size:19px;line-height:1.55;margin-bottom:26px;font-weight:600;}
.option{
  display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;border:1px solid var(--border);
  background:var(--input-bg);margin-bottom:12px;cursor:pointer;transition:all .2s var(--ease);
}
.option:hover{border-color:var(--border-strong);}
.option.selected{border-color:var(--accent);background:rgba(var(--accent-rgb),.1);}
.option .bullet{
  width:22px;height:22px;border-radius:7px;border:1.6px solid var(--muted-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.option.selected .bullet{background:var(--accent);border-color:var(--accent);color:#04150C;}
.option .bullet svg{width:13px;height:13px;opacity:0;}
.option.selected .bullet svg{opacity:1;}
.option .otext{font-size:14.5px;line-height:1.5;}
.option .olabel{font-family:var(--font-mono);color:var(--muted);font-size:12px;margin-right:2px;}
.quiz-nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px;}

/* =========================================================
   RESULT
========================================================= */
.result-card{max-width:640px;margin:20px auto 0;padding:44px clamp(20px,5vw,56px);text-align:center;}
.ring-wrap{position:relative;width:200px;height:200px;margin:8px auto 20px;}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-wrap .ring-bg{fill:none;stroke:var(--border);stroke-width:11;}
.ring-wrap .ring-fg{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-center .pct{font-family:var(--font-mono);font-size:40px;font-weight:700;}
.ring-center .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
.status-badge{
  display:inline-flex;align-items:center;gap:8px;padding:9px 22px;border-radius:999px;font-weight:800;
  font-size:14px;letter-spacing:.04em;margin-bottom:8px;
}
.status-badge.pass{background:rgba(var(--accent-rgb),.15);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.4);}
.status-badge.fail{background:rgba(var(--danger-rgb),.14);color:var(--danger);border:1px solid rgba(var(--danger-rgb),.4);}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 8px;}
.rstat{padding:16px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--border);}
.rstat b{display:block;font-family:var(--font-mono);font-size:22px;}
.rstat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.result-meta{text-align:left;margin-top:26px;padding-top:22px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.result-meta b{color:var(--text);}

/* =========================================================
   ADMIN LOGIN
========================================================= */
.login-card{max-width:400px;margin:60px auto 0;padding:38px 32px;text-align:center;}
.login-icon{width:56px;height:56px;border-radius:16px;margin:0 auto 20px;background:linear-gradient(145deg, rgba(var(--accent-rgb),.2), rgba(var(--accent-2-rgb),.18));border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--accent);}
.login-icon svg{width:26px;height:26px;}

/* =========================================================
   ADMIN DASHBOARD
========================================================= */
.admin-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{padding:20px 20px;}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-card .icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);color:var(--accent-2);}
.stat-card .icon svg{width:17px;height:17px;}
.stat-card .val{font-family:var(--font-mono);font-size:28px;font-weight:700;margin-top:14px;}
.stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:2px;}
.stat-card .delta{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;}
.stat-card .delta.good{color:var(--accent);background:rgba(var(--accent-rgb),.12);}
.stat-card .delta.bad{color:var(--danger);background:rgba(var(--danger-rgb),.12);}

.chart-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-bottom:22px;}
@media(max-width:980px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{padding:20px 20px 12px;}
.chart-card h4{font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;font-weight:700;}
.chart-card .cwrap{position:relative;height:210px;}

.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:18px 20px;}
.search-box{position:relative;flex:1;min-width:200px;}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
.search-box input{padding-left:38px;}
.select-sm{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:13px;min-width:130px;}

.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px;}
table.data thead th{
  text-align:left;padding:13px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
}
table.data thead th:hover{color:var(--text);}
table.data thead th .sort-ico{display:inline-block;margin-left:4px;opacity:.5;font-size:10px;}
table.data tbody td{padding:13px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.data tbody tr{transition:background .15s;}
table.data tbody tr:hover{background:rgba(var(--accent-2-rgb),.05);}
.badge-result{padding:4px 11px;border-radius:8px;font-size:11.5px;font-weight:800;letter-spacing:.03em;}
.badge-result.PASS{background:rgba(var(--accent-rgb),.14);color:var(--accent);}
.badge-result.FAIL{background:rgba(var(--danger-rgb),.13);color:var(--danger);}
.score-cell{font-family:var(--font-mono);font-weight:700;}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state svg{width:40px;height:40px;margin-bottom:14px;opacity:.5;}
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:10px;}
.pager{display:flex;gap:6px;}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;}
.pager button.active{background:var(--accent);color:#04150C;border-color:var(--accent);font-weight:700;}
.pager button:disabled{opacity:.35;cursor:not-allowed;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   QUESTION BANKS
   Correct answers were derived from the green-highlighted
   text in the uploaded source test papers (color 00B050).
   `correct` is the zero-based index into `options`.
========================================================= */
const TESTS = {
  ESD: {
    key:'ESD', name:'ESD Awareness', tagline:'Electro-Static Discharge safety fundamentals',

const SUPABASE_URL = 'https://zsmklcrmjtpwfvmsstpc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_upF29T-8A0VKA3vpS_11Jg_xIPPsNV_';
const SUPABASE_TABLE = 'test_submissions';

function sbHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, extra||{});
}
// app (camelCase) <-> supabase table (snake_case) row mapping
function toDbRow(r){
  return {
    id: r.id, name: r.name, code: r.code, dept: r.dept, trainer: r.trainer,
    test_date: r.date, test: r.test, test_name: r.testName,
    correct: r.correct, total: r.total, score: r.score, result: r.result,
    submitted_at: r.submittedAt
  };
}
function fromDbRow(row){
  return {
    id: row.id, name: row.name, code: row.code, dept: row.dept, trainer: row.trainer,
    date: row.test_date, test: row.test, testName: row.test_name,
    correct: row.correct, total: row.total, score: row.score, result: row.result,
    submittedAt: row.submitted_at
  };
}

const Store = {
  lastError:null,
  async getSubmissions(){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=*&order=submitted_at.desc`, {
        headers: sbHeaders()
      });
      if(!res.ok){ this.lastError = await res.text(); return []; }
      const rows = await res.json();
      this.lastError = null;
      return rows.map(fromDbRow);
    }catch(e){ this.lastError = e.message; return []; }
  },
  async addSubmission(record){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`, {
        method:'POST',
        headers: sbHeaders({ 'Prefer':'return=minimal' }),
        body: JSON.stringify([toDbRow(record)])
      });
      if(!res.ok){ this.lastError = await res.text(); }
      else { this.lastError = null; }
    }catch(e){ this.lastError = e.message; }
  },
  async clearSubmissions(){
    try{
      // filter required by PostgREST for DELETE — score is always >= 0 so this matches every row
      await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?score=gte.0`, {
        method:'DELETE', headers: sbHeaders({ 'Prefer':'return=minimal' })
      });
    }catch(e){ this.lastError = e.message; }
  },
  // one-time import of data saved by the old (pre-Supabase) version of this app,
  // which lived in the artifact's built-in window.storage.
  async migrateLegacyData(){
    if(typeof window.storage === 'undefined') return { ok:false, count:0, msg:'window.storage is not available in this environment.' };
    try{
      const r = await window.storage.get('submissions_all', true);
      const list = r && r.value ? JSON.parse(r.value) : [];
      if(!list.length) return { ok:true, count:0, msg:'No legacy data found.' };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=id`, {
        method:'POST',
        headers: sbHeaders({ 'Prefer':'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(list.map(toDbRow))
      });
      if(!res.ok) return { ok:false, count:0, msg: await res.text() };
      return { ok:true, count:list.length, msg:`Imported ${list.length} record(s).` };
    }catch(e){ return { ok:false, count:0, msg:e.message }; }
  },
  async getTheme(){
    try{
      const r = await window.storage.get('theme_pref', false);
      return r && r.value ? r.value : null;
    }catch(e){ return null; }
  },
  async setTheme(v){
    try{ await window.storage.set('theme_pref', v, false); }catch(e){}
  }
};

const root = document.getElementById('app');

function fmtDate(d){
  if(!d) return '';
  const parts = d.split('-');
  if(parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'sub-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
// Escape user-entered text before it's dropped into template HTML, so a stray
// quote, "&" or "<" in someone's name can never corrupt the markup or break
// the page.
function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

}

      ? `<button class="btn btn-primary" onclick="nextQ()">Next ${ICONS.arrowRight}</button>`
      : `<button class="btn btn-primary" ${!allAnswered?'disabled':''} onclick="submitQuiz()">Submit Test ${ICONS.check}</button>`}

function jumpTo(idx){ state.qIndex=idx; render(); window.scrollTo({top:0,behavior:'smooth'}); }

async function submitQuiz(){
  const t = TESTS[state.testKey];
  let correct = 0;
  t.questions.forEach((q,idx)=>{ if(state.answers[idx]===q.correct) correct++; });
  const percent = Math.round((correct/t.total)*100);
  const pass = percent >= t.passPercent;
  const record = {
    id: uid(),
    name: state.candidate.name,
    code: state.candidate.code,
    dept: state.candidate.dept,
    trainer: state.candidate.trainer,
    date: state.candidate.date,
    test: t.key,
    testName: t.name,
    correct, total: t.total, score: percent,
    result: pass ? 'PASS':'FAIL',
    submittedAt: new Date().toISOString(),
  };
  state.result = record;
  state.view = 'result';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  await Store.addSubmission(record);
}

function getFilteredSortedRows(){
  const a = state.admin;
  let rows = state.adminData.slice();
  if(a.search){
    const s = a.search.toLowerCase();
    rows = rows.filter(r => (r.name+r.code+r.dept+r.trainer).toLowerCase().includes(s));
  }
  if(a.testFilter!=='ALL') rows = rows.filter(r=>r.test===a.testFilter);
  if(a.resultFilter!=='ALL') rows = rows.filter(r=>r.result===a.resultFilter);
  if(a.deptFilter!=='ALL') rows = rows.filter(r=>r.dept===a.deptFilter);
  rows.sort((x,y)=>{
    let vx=x[a.sortKey], vy=y[a.sortKey];
    if(typeof vx==='string') vx=vx.toLowerCase();
    if(typeof vy==='string') vy=vy.toLowerCase();
    if(vx<vy) return a.sortDir==='asc'?-1:1;
    if(vx>vy) return a.sortDir==='asc'?1:-1;
    return 0;
  });
  return rows;
}

    <div class="table-toolbar">
      <div class="search-box">${ICONS.search}<input type="text" id="admSearch" placeholder="Search name, code, department, trainer..." value="${a.search}"></div>
      <select class="select-sm" id="admTestFilter">
        <option value="ALL">All Tests</option>
        ${Object.keys(TESTS).map(k=>`<option value="${k}" ${a.testFilter===k?'selected':''}>${TESTS[k].name}</option>`).join('')}
      </select>
      <select class="select-sm" id="admResultFilter">
        <option value="ALL">All Results</option>
        <option value="PASS" ${a.resultFilter==='PASS'?'selected':''}>Pass</option>
        <option value="FAIL" ${a.resultFilter==='FAIL'?'selected':''}>Fail</option>
      </select>
      <select class="select-sm" id="admDeptFilter">
        <option value="ALL">All Departments</option>
        ${depts.map(d=>`<option ${a.deptFilter===d?'selected':''}>${d}</option>`).join('')}
      </select>
    </div>
    <div class="table-wrap">
      ${rows.length===0 ? `
        <div class="empty-state">${ICONS.search}<p>No submissions match your filters yet.</p></div>
      ` : `
      <table class="data">
        <thead><tr>
          <th onclick="sortBy('name')">Employee ${sortArrow('name')}</th>
          <th onclick="sortBy('code')">Code ${sortArrow('code')}</th>
          <th onclick="sortBy('dept')">Department ${sortArrow('dept')}</th>
          <th onclick="sortBy('trainer')">Trainer ${sortArrow('trainer')}</th>
          <th onclick="sortBy('test')">Test ${sortArrow('test')}</th>
          <th onclick="sortBy('date')">Date ${sortArrow('date')}</th>
          <th onclick="sortBy('score')">Score % ${sortArrow('score')}</th>
          <th onclick="sortBy('result')">Result ${sortArrow('result')}</th>
        </tr></thead>
        <tbody>
          ${pageRows.map(r=>`
            <tr>
              <td>${esc(r.name)}</td>
              <td class="mono">${esc(r.code)}</td>
              <td>${esc(r.dept)}</td>
              <td>${esc(r.trainer)}</td>
              <td>${esc(r.testName)}</td>
              <td class="mono">${fmtDate(r.date)}</td>
              <td class="score-cell">${r.score}%</td>
              <td><span class="badge-result ${r.result}">${r.result}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="table-footer">
      <div>Showing ${rows.length===0?0:((a.page-1)*a.pageSize+1)}–${Math.min(a.page*a.pageSize,rows.length)} of ${rows.length}</div>
      <div class="pager">
        <button ${a.page<=1?'disabled':''} onclick="gotoPage(${a.page-1})">${ICONS.arrowLeft}</button>
        ${Array.from({length:totalPages},(_,idx)=>idx+1).slice(0,7).map(p=>`<button class="${p===a.page?'active':''}" onclick="gotoPage(${p})">${p}</button>`).join('')}
        <button ${a.page>=totalPages?'disabled':''} onclick="gotoPage(${a.page+1})">${ICONS.arrowRight}</button>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin-top:18px;">
    <button class="btn btn-danger btn-sm" onclick="resetAllData()">Reset all submission data</button>
  </div>
  `;
}

function adminLogout(){ state.isAdmin=false; goHome(); }
async function refreshAdmin(){ state.adminData = await Store.getSubmissions(); render(); }
async function runMigration(){
  const r = await Store.migrateLegacyData();
  alert(r.msg);
  if(r.ok && r.count>0) await refreshAdmin();
}
function sortBy(key){
  const a = state.admin;
  if(a.sortKey===key){ a.sortDir = a.sortDir==='asc'?'desc':'asc'; } else { a.sortKey=key; a.sortDir='asc'; }
  render();
}
function gotoPage(p){ state.admin.page = p; render(); }
async function resetAllData(){
  if(!confirm('This will permanently delete ALL stored submissions for every user. Continue?')) return;
  await Store.clearSubmissions();
  state.adminData = [];
  render();
}
function exportExcel(){
  const rows = getFilteredSortedRows().map(r=>({
    'Employee Name': r.name, 'Employee Code': r.code, 'Department': r.dept, 'Trainer': r.trainer,
    'Test': r.testName, 'Date': fmtDate(r.date), 'Correct': r.correct, 'Total': r.total,
    'Score %': r.score, 'Result': r.result, 'Submitted At': r.submittedAt
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:20},{wch:14},{wch:16},{wch:18},{wch:16},{wch:12},{wch:9},{wch:8},{wch:9},{wch:8},{wch:22}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Results');
  XLSX.writeFile(wb, `syrma-training-results-${todayISO()}.xlsx`);
}

function themeColors(){
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  return { text: dark? '#8C97AE':'#5A6479', grid: dark? 'rgba(255,255,255,.07)':'rgba(16,23,42,.08)' };
}

function renderCharts(){
  if(typeof Chart==='undefined') return;
  const data = state.adminData;
  const tc = themeColors();
  Chart.defaults.font.family = "'Inter',sans-serif";
  Chart.defaults.color = tc.text;

  Object.values(charts).forEach(c=>{ if(c) c.destroy(); });

  const passCount = data.filter(r=>r.result==='PASS').length;
  const failCount = data.length-passCount;
  const c1 = document.getElementById('chartPass');
  if(c1) charts.pass = new Chart(c1, {
    type:'doughnut',
    data:{ labels:['Pass','Fail'], datasets:[{ data:[passCount,failCount], backgroundColor:['#21C97B','#FF5C72'], borderWidth:0 }]},
    options:{ maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,padding:14}}}, cutout:'68%' }
  });

  const testKeys = Object.keys(TESTS);
  const avgByTest = testKeys.map(k=>{
    const rs = data.filter(r=>r.test===k);
    return rs.length? Math.round(rs.reduce((s,r)=>s+r.score,0)/rs.length) : 0;
  });
  const c2 = document.getElementById('chartByTest');
  if(c2) charts.byTest = new Chart(c2, {
    type:'bar',
    data:{ labels:testKeys, datasets:[{ data:avgByTest, backgroundColor:'#4C8DFF', borderRadius:8, maxBarThickness:46 }]},
    options:{ maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ y:{beginAtZero:true,max:100,grid:{color:tc.grid}}, x:{grid:{display:false}} } }
  });

  const depts = [...new Set(data.map(r=>r.dept))].filter(Boolean);
  const countByDept = depts.map(d=>data.filter(r=>r.dept===d).length);
  const c3 = document.getElementById('chartByDept');
  if(c3) charts.byDept = new Chart(c3, {
    type:'bar',
    data:{ labels:depts, datasets:[{ data:countByDept, backgroundColor:'#21C97B', borderRadius:8, maxBarThickness:36 }]},
    options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{beginAtZero:true, grid:{color:tc.grid}}, y:{grid:{display:false}} } }
  });
}

function wireAdmin(){
  const s = document.getElementById('admSearch');
  if(s){
    s.addEventListener('input', e=>{ state.admin.search = e.target.value; state.admin.page=1; render(); });
    // keep caret position after re-render
    s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  }
  const tf = document.getElementById('admTestFilter');
  if(tf) tf.addEventListener('change', e=>{ state.admin.testFilter=e.target.value; state.admin.page=1; render(); });
  const rf = document.getElementById('admResultFilter');
  if(rf) rf.addEventListener('change', e=>{ state.admin.resultFilter=e.target.value; state.admin.page=1; render(); });
  const df = document.getElementById('admDeptFilter');
  if(df) df.addEventListener('change', e=>{ state.admin.deptFilter=e.target.value; state.admin.page=1; render(); });
  renderCharts();
}

/* =========================================================
   VIEW WIRING DISPATCH
========================================================= */
function wireView(){
  if(state.view==='info') wireInfoForm();
  if(state.view==='adminLogin') wireAdminLogin();
  if(state.view==='admin') wireAdmin();
  if(state.view==='result'){
    requestAnimationFrame(()=>{
      const ring = document.getElementById('ringFg');
      if(ring){
        const circumference = 2*Math.PI*80;
        const offset = circumference - (state.result.score/100)*circumference;
        requestAnimationFrame(()=>{ ring.style.strokeDashoffset = offset; });
      }
    });
  }
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  try{
    const savedTheme = await Store.getTheme();
    if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    else {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', prefersLight ? 'light':'dark');
    }
  }catch(e){}
  render();
})();
</script>
</body>
